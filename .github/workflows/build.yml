name: Build Space Trader Light

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Build EXE
      run: |
        # بناء ملف واحد فقط (onefile) وبدون نافذة سوداء (noconsole)
        # نمرر ملفات الويب لكي يتم تضمينها داخل الـ exe
        pyinstaller --noconsole --onefile --add-data "index.html;." --add-data "style.css;." --add-data "game.js;." app.py

    - name: Rename and Upload
      run: |
        mv dist/app.exe dist/SpaceTrader.exe
      
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Space-Trader-Light-EXE
        path: dist/SpaceTrader.exe
